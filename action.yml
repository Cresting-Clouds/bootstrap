name: Cresting Clouds Bootstrap
description: Verify and execute a Cresting Clouds workflow reference
inputs:
  ref:
    description: Nimbus-signed, short-lived execution reference
    required: true
runs:
  using: composite
  steps:
    - name: Prepare runtime
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.3.14
    - name: Bootstrap
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

